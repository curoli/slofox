[package]
name = "slofox"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "An audio-driven cartoon talk show studio for OBS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/curoli/slofox"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "std", "default_app", "3d_bevy_render", "ui_bevy_render", "bevy_winit",
    "default_font", "multi_threaded", "keyboard", "mouse", "wayland", "x11",
] }
clap = { version = "4.6", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.release]
lto = "thin"
strip = true
